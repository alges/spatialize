[project]
name = "spatialize"
dynamic = ["dependencies", "version"]
authors = [{ name = "ALGES Lab", email = "contacto@alges.cl"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
description = "Spatialize: A Python wrapper for C++ ESI library"
keywords = ['ESI ensemble spatial interpolation']
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"

[project.optional-dependencies]
evaluation = ["pykrige", "geopandas", "seaborn"]   # baselines, maps and plots in spatialize.evaluation
scenarios = ["PyYAML"]                             # spatialize.scenarios (conformance suite)

[project.urls]
Repository = "https://github.com/alges/spatialize"

[build-system]
requires = [
    "setuptools",
    "wheel",
    "pybind11[global]"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
