id: P12-posterior-audit
version: 2
tier: T2
evaluator: posterior_audit
book:
  topic: "outliers and provenance: a value its neighbours do not support may be an error or an unrepresented part of the domain"
  draft_2026_10: "ch 12, decoders that return a law (the dry-days example); ch 7, scoring the predictive law"   # the book is a draft
purpose: >
  Posterior analysis reads each datum against the law the other data give it. On replicate fields it
  must find planted errors, tell a raised patch (neighbours surprised the same way) from an isolated
  error (neighbours surprised the other way, their laws pulled towards it), and
  decluster a preferential design. The share of clean fields with a false flag is checked against the
  false discovery rate, a promise the laws cannot keep while their tails are too light, which the
  check records as a known failure.
domain: {box: [[0.0, 1.0], [0.0, 1.0]]}
truth: {generator: smooth_plus_noise}
data:
  n: 300
  noise: 0.1
  patch: {side: 0.2, shift: 1.5}      # a raised square of data: a sub-population
  preferential: {above: 0.8}          # half of the data where the field exceeds 0.8
  q: 0.05                             # false discovery rate of the flags
  fields: {ci: 20, full: 40}         # sized for the shift checks (see provenance)
  generator_seed: 20261012
estimators_T: {ci: 300, full: 300}
estimators:
  # Mondrian rate 10/3 on the unit square: Spatialize's alpha = 0.85, as in the measurements of the
  # theory page.
  - {id: idw, encoder: mondrian, rate: 3.3333333, decoder: idw, params: {exponent: 2.0}, empty_cells: nan}
checks:
  - id: errors-found
    title: "the planted errors are flagged (share above one half)"
    kind: errors_found
    family: one-sided
    estimator: idw
    bound: 0.5
  - id: clean-flags
    title: "clean fields carry no flag beyond the false discovery rate"
    kind: clean_flags
    family: one-sided
    estimator: idw
    bound: 0.05
    known_failure: >
      the laws' tails stay too light at the 99 % level after widening, the spread factor and Student-t
      tails (coverage 0.97-0.99), so clean fields carry false flags (5 of 8 in the measurements of
      the theory page); the false discovery rate is not controlled (theory page, "What the corrections
      achieve")
  - id: shift-patch
    title: "the neighbours of a raised patch's data are surprised the same way (shift above the others')"
    kind: shift_patch
    family: paired-relation
    estimator: idw
  - id: shift-error
    title: "the neighbours of an isolated error are surprised the other way (negative shift)"
    kind: shift_error
    family: one-sided
    estimator: idw
  - id: declustering
    title: "the declustered mean is closer to the field's mean than the plain one (preferential design)"
    kind: declustering
    family: paired-relation
    estimator: idw
  - id: weights
    title: "the declustering weights are positive and sum to 1"
    kind: weights
    family: almost-sure
    estimator: idw
provenance:
  v1: >
    2026-10-08: first version, with the posterior analysis (steps 1-3). Checks, bounds and sizes fixed
    before the first run, from the measurements of the theory page; the clean-flags check is recorded
    as a known failure from those measurements. The first run (ci, 10 fields, seed 1) found the
    coherence check underpowered (mean difference 0.097, standard error 0.038, p = 0.016 against a
    Holm level of 5e-4), while full mode (30 fields) passed (0.084 ± 0.017, p = 1.5e-5). The sizes
    had not been computed with the power rule before that run; they were then sized for the paired
    t-test, effect 0.08, field standard deviation 0.12, worst-case Holm level 2.5e-5 one-sided and
    power 0.9, K ≈ (4.06 + 1.28)² · 0.12² / 0.08² ≈ 64, giving 40 fields in ci and 80 in full. The
    thresholds and bounds are unchanged. Before any commit, still in v1, the coherence check passed at
    its limit (seeds 2 and 3: p = 2.8e-4 and 4.9e-4 against 5e-4), the coherence being a weak signal
    (0.06-0.10): inside a patch a datum's law is built from patch neighbours, so the datum itself is
    not surprised. Measured on 20 fields, the neighbours' mean signed position (shift) separates the
    patch (difference 0.215, sd 0.121) and the isolated error (shift -0.353, sd 0.191), whose value
    pulls its neighbours' laws towards it. User decision (2026-10-08): add the shift reading, check
    it in P12, keep the coherence as a descriptive reading. Sized for an effect of 1.75 standard
    deviations, K ≈ (4.06 + 1.28)² / 1.75² ≈ 9.3, giving 20 fields in ci and 40 in full.
  v2: "2026-10-09: profile mondrian, Spatialize's default Mondrian, is now the theory's process (the partition of Spatialize 1.2 being mondrian-legacy); checks, thresholds and sizes unchanged."
