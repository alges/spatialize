id: E3-mondrian-triple-cooccurrence
version: 1
tier: T1
evaluator: partition_law
book:
  topic: "co-occurrence of a set of locations under the Mondrian process"
  draft_2026_09: "eq (5.2.2)"   # the book is a draft: numbers may change
purpose: >
  For the Mondrian process of rate λ a set S of locations lies in one cell with probability
  exp(−λ Σ_c range_c(S)), since S stays together when no cut falls inside the box it spans. Five
  triples of different shapes test the closed form beyond pairs (E2). Which locations share a cell is
  read through the estimator, as in E1.
domain: {box: [[0.0, 1.0], [0.0, 1.0]]}
data:
  sets:
    - [[0.40, 0.50], [0.50, 0.50], [0.60, 0.50]]   # collinear along an axis
    - [[0.45, 0.45], [0.50, 0.50], [0.55, 0.55]]   # collinear along the diagonal
    - [[0.45, 0.45], [0.55, 0.45], [0.50, 0.55]]   # triangle
    - [[0.35, 0.40], [0.60, 0.45], [0.50, 0.60]]   # larger triangle
    - [[0.50, 0.50], [0.55, 0.50], [0.50, 0.58]]   # small right angle
estimators:
  - {id: cm-theory, encoder: mondrian-theory, rate: 3.0, decoder: cellmean, params: {}, empty_cells: nan}
  - {id: cm, encoder: mondrian, rate: 3.0, decoder: cellmean, params: {}, empty_cells: nan}
checks:
  - id: c1
    title: "triple co-occurrence = exp(−λ Σ range)"
    kind: set_cooccurrence
    family: gof-closed
    estimators: [cm-theory, cm]
    n_members: {ci: 4000, full: 16000}
    expect:
      mondrian-theory: pass
      mondrian: reject   # negative control, as in E2
provenance:
  v1: "2026-10-07: first version, with the cell-mean decoder and mondrian-raw (phase 2); sizes fixed before the first run"
