id: E2-mondrian-pair-cooccurrence
version: 4
tier: T1
evaluator: pair_cooccurrence
book:
  topic: "Mondrian process; closed form of its pair co-occurrence; co-occurrence read through the estimator"
  draft_2026_09: "Def 2.3.1, eq (5.2.2), Fig 2.4g; Fig 8.1"   # the book is a draft: numbers may change
purpose: >
  The law of the partition process. For a Mondrian process of rate λ the probability that two
  locations share a cell is e({x, y}) = exp(−λ‖x − y‖₁). It is read through the estimator itself:
  with a single datum and empty cells returning NaN, a member is finite exactly when the query
  falls in the datum's cell, so the fraction of finite members estimates the co-occurrence.
domain: {box: [[0.0, 1.0], [0.0, 1.0]]}
data:
  datum: [0.5, 0.5]                 # one observation at the centre, value 1
  directions: [[1, 0], [1, 1]]      # along an axis and along the diagonal (ℓ1-normalised steps)
  displacements: [0.05, 0.1, 0.2, 0.3]
estimators:
  - {id: idw, encoder: mondrian-legacy, rate: 3.0, decoder: idw, params: {exponent: 2.0}, empty_cells: nan}
  - {id: idw-theory, encoder: mondrian-theory, rate: 3.0, decoder: idw, params: {exponent: 2.0}, empty_cells: nan}
checks:
  - id: c1
    title: "pair co-occurrence = exp(−λ‖h‖₁)"
    estimators: [idw, idw-theory]
    family: gof-closed
    delta: {ci: 0.05, full: 0.02}   # minimum detectable effect in a co-occurrence
    n_members: {ci: 3100, full: 19300}   # power ≥ 0.9 at delta, up to 50 tests under Holm (budget.required_n)
    expect:
      mondrian-theory: pass
      # Negative control: spatialize's default Mondrian draws the cut axis uniformly and always
      # splits the root (not the book's Mondrian process); measured co-occurrence is 4–21 % below the closed form on
      # the unit square. The test must reject it — that proves its power.
      mondrian-legacy: reject
provenance:
  v2: "2026-10-06: encoder profiles renamed (mondrian, mondrian-theory, voronoi, voronoi-data); results unchanged"
  v3: "2026-10-06: estimator idw-theory on the theory's Mondrian process (spatialize's p_process='mondrian-raw'); c1 now reads both estimators, the default Mondrian remaining the negative control"
  v4: "2026-10-09: Spatialize's default Mondrian became the theory's process (p_process 'mondrian'); the negative control now reads the Mondrian partition of Spatialize 1.2, profile mondrian-legacy, which keeps failing the closed form. Thresholds and sizes unchanged."
