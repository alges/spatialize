id: S03-anisotropic-field
version: 1
tier: T3
evaluator: map_visual
book: "§12.3.1, Fig 12.1, eqs (12.3.8)–(12.3.9)"
purpose: >
  An anisotropic stationary Gaussian field, the variogram's own ground. The estimator is told
  nothing about the anisotropy (axis-aligned Mondrian cuts, isotropic decoder); the elongation at
  30° must nevertheless be clearly visible in its point map (visual criterion V1).
domain: {box: [[0.0, 1.0], [0.0, 1.0]]}
truth:
  generator: sgf_exponential
  covariance: "exp(−√(hᵀAh)), A = R_ϑᵀ diag(a1⁻², a2⁻²) R_ϑ"
  a1: 0.45
  a2: 0.09
  theta_deg: 30.0
data:
  design: {type: uniform, n: 400}
  grid: 40                          # queries: 40×40 cell centres, row-major
  mode: pinned                      # data/{samples,values,truth}_<k>.npy, drawn jointly by Cholesky
  fields: {ci: 6, full: 6}
  generator_seed: 20261005
estimators_T: {ci: 100, full: 300}
estimators:
  - {id: idw, encoder: mondrian, rate: 5.0, decoder: idw, params: {exponent: 2.0}, empty_cells: nan}
checks:
  - id: v1a
    title: "V1 anisotropy direction visible: |θ(median map) − 30°| < 10°"
    estimator: idw
    family: equivalence
    functional: orientation
    map: point                      # median of the members per location
    margin_deg: 10.0
  - id: v1b
    title: "V1 anisotropy strength visible: coherence(map) > 0.5·coherence(truth)"
    estimator: idw
    family: one-sided
    functional: coherence_ratio
    map: point
    min_ratio: 0.5
provenance:
  calibration: "truth fields: θ = 26–29°, coherence 0.70–0.76; isotropic control coherence 0.05–0.09"
