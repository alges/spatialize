id: E1-mondrian-line-partition
version: 1
tier: T1
evaluator: partition_law
book:
  topic: "partition law of a few points on a line under Poisson cuts (the one-dimensional Mondrian process)"
  draft_2026_09: "Def 2.3.1; worked example of the partition law of points on a line"   # the book is a draft
purpose: >
  On a line the Mondrian process of rate λ cuts at the points of a Poisson process of rate λ, so each
  gap between consecutive points is cut independently with probability 1 − exp(−λ g). The four points
  are therefore grouped into intervals of consecutive points, with closed-form probabilities, and never
  otherwise. Which points share a cell is read through the estimator: the cell mean of the indicator of
  a point is positive exactly at the points of its cell.
domain: {box: [[0.0, 2.0]]}
data:
  points: [[0.2], [0.5], [0.8], [1.3]]
estimators:
  - {id: cm-theory, encoder: mondrian-theory, rate: 2.0, decoder: cellmean, params: {}, empty_cells: nan}
  - {id: cm, encoder: mondrian, rate: 2.0, decoder: cellmean, params: {}, empty_cells: nan}
checks:
  - id: groupings
    title: "frequencies of the eight interval groupings = their Poisson-cut probabilities"
    kind: line_groupings
    family: gof-closed
    estimators: [cm-theory, cm]
    n_members: {ci: 5000, full: 20000}
    expect:
      mondrian-theory: pass
      # Negative control: Spatialize's default Mondrian always cuts the whole box once, so on a line it
      # cuts more often than the Poisson process of the same rate.
      mondrian: reject
  - id: intervals
    title: "only intervals of consecutive points share a cell"
    kind: interval_only
    family: almost-sure
    estimators: [cm-theory, cm]
    n_members: {ci: 5000, full: 20000}
provenance:
  v1: "2026-10-07: first version, with the cell-mean decoder and mondrian-raw (phase 2); sizes fixed before the first run"
