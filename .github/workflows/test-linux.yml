name: Test

run-name: Running test on Linux

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Py
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build

      - name: Build
        run: python -m build

      - name: Get WHL
        run: echo "WHEEL_FILE=$(ls dist/*.whl)" >> $GITHUB_ENV

      - name: Install whl
        run: pip install ${{ env.WHEEL_FILE }}

      - name: Run example script
        run: python examples/scripted_examples/esi_3d_nongriddata.py

      # the kd-tree's bounds once depended on the order in which GCC evaluates function arguments
      # (issue #15), which a Clang build never shows: check the search against brute force here
      - name: Nearest-neighbour search against brute force (GCC build)
        run: |
          pip install pytest
          python setup.py build_ext --inplace
          python -m pytest -q tests/unit/test_nearest_neighbours.py

      - name: Run conformance scenarios
        run: |
          pip install PyYAML
          python -m spatialize.scenarios --mode ci