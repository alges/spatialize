id: S03-anisotropic-field
version: 10
tier: T3
evaluator: map_visual
book:
  topic: "worked example: anisotropic stationary Gaussian field (exponential covariance, rotated ranges)"
  draft_2026_09: "§12.3.1, Fig 12.1, eqs (12.3.8)–(12.3.9)"   # the book is a draft: numbers may change
purpose: >
  An anisotropic stationary Gaussian field, the variogram's own ground. No estimator is told about
  the anisotropy (axis-aligned Mondrian cuts or Voronoi cells, isotropic decoders); the elongation
  at 30° must nevertheless be clearly visible in each estimator's point map (visual criterion V1).
domain: {box: [[0.0, 1.0], [0.0, 1.0]]}
truth:
  generator: sgf_exponential
  covariance: "exp(−√(hᵀAh)), A = R_ϑᵀ diag(a1⁻², a2⁻²) R_ϑ"
  a1: 0.45
  a2: 0.09
  theta_deg: 30.0
data:
  design: {type: uniform, n: 400}
  grid: 40                          # queries: 40×40 cell centres, row-major
  mode: pinned                      # data/{samples,values,truth}_<k>.npy, drawn jointly by Cholesky
  fields: {ci: 80, full: 80}
  generator_seed: 20261005
estimators_T: {ci: 100, full: 300}
estimators:
  # Mondrian rate 5 on the unit square: E[#cells] = (1 + 5)² = 36 for the book's process.
  - {id: idw, encoder: mondrian, rate: 5.0, decoder: idw, params: {exponent: 2.0}, empty_cells: nan}
  - {id: aidw, encoder: mondrian, rate: 5.0, decoder: adaptiveidw,
     params: {metric: mae}, empty_cells: nan}   # threads from the session; parallel == serial bitwise
  # Isotropic exponential kriging (spatialize: exp(−3d/r)); scale = geometric mean of the true
  # ranges, √(0.45·0.09) = 0.201 (same ellipse area), practical range r = 3·0.201 = 0.604.
  - {id: krig, encoder: mondrian, rate: 5.0, decoder: kriging,
     params: {model: exponential, nugget: 0.0, range: 0.604, sill: 1.0}, empty_cells: nan}
  # Poisson–Voronoi intensity 36: the same expected number of cells as the Mondrian estimators.
  - {id: vor-uniform-idw, encoder: voronoi, rate: 36.0, decoder: idw,
     params: {exponent: 2.0}, empty_cells: nan}
  - {id: vor-data-idw, encoder: voronoi-data, rate: 36.0, decoder: idw,
     params: {exponent: 2.0}, empty_cells: nan}
  # Same decoders as krig/aidw on the uniform Voronoi profile (not in the public API yet: the runner
  # reaches them through libspatialize.run).
  - {id: vor-uniform-krig, encoder: voronoi, rate: 36.0, decoder: kriging,
     params: {model: exponential, nugget: 0.0, range: 0.604, sill: 1.0}, empty_cells: nan}
  - {id: vor-uniform-aidw, encoder: voronoi, rate: 36.0, decoder: adaptiveidw,
     params: {metric: mae}, empty_cells: nan}
  # The decoders of phase 2 on the Mondrian partition (v10).
  - {id: sharp, encoder: mondrian, rate: 5.0, decoder: sharpidw,
     params: {metric: mae, kappa_r: 1.5, kappa_g: 0.2, rho_max: 3.0}, empty_cells: nan}
  - {id: wdraw-aidw, encoder: mondrian, rate: 5.0, decoder: wdraw_adaptiveidw, params: {metric: mae}, empty_cells: nan}
  - {id: wdraw-sharp, encoder: mondrian, rate: 5.0, decoder: wdraw_sharpidw,
     params: {metric: mae, kappa_r: 1.5, kappa_g: 0.2, rho_max: 3.0}, empty_cells: nan}
  - {id: wdraw-idw, encoder: mondrian, rate: 5.0, decoder: wdraw_idw, params: {exponent: 2.0}, empty_cells: nan}
  - {id: wdraw-krig, encoder: mondrian, rate: 5.0, decoder: wdraw_kriging,
     params: {model: exponential, nugget: 0.0, range: 0.604, sill: 1.0, negative_weights: clip}, empty_cells: nan}
  - {id: draw, encoder: mondrian, rate: 5.0, decoder: draw, params: {}, empty_cells: nan}
checks:
  # The same two pre-registered criteria for every estimator:
  #   v1a — direction visible: |θ(median map) − 30°| < 10° (TOST over the K fields)
  #   v1b — strength visible: coherence(map) > 0.5·coherence(truth) (one-sided t over the K fields)
  - {id: v1a, title: "V1 direction visible (idw)", estimator: idw, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b, title: "V1 strength visible (idw)", estimator: idw, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v1a-aidw, title: "V1 direction visible (adaptive idw)", estimator: aidw, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-aidw, title: "V1 strength visible (adaptive idw)", estimator: aidw, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v1a-krig, title: "V1 direction visible (kriging)", estimator: krig, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-krig, title: "V1 strength visible (kriging)", estimator: krig, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v1a-vor-uniform, title: "V1 direction visible (Voronoi uniform, idw)", estimator: vor-uniform-idw,
     family: equivalence, functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-vor-uniform, title: "V1 strength visible (Voronoi uniform, idw)", estimator: vor-uniform-idw,
     family: one-sided, functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v1a-vor-data, title: "V1 direction visible (Voronoi data, idw)", estimator: vor-data-idw,
     family: equivalence, functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-vor-data, title: "V1 strength visible (Voronoi data, idw)", estimator: vor-data-idw,
     family: one-sided, functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v1a-vor-uniform-krig, title: "V1 direction visible (Voronoi uniform, kriging)", estimator: vor-uniform-krig,
     family: equivalence, functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-vor-uniform-krig, title: "V1 strength visible (Voronoi uniform, kriging)", estimator: vor-uniform-krig,
     family: one-sided, functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v1a-vor-uniform-aidw, title: "V1 direction visible (Voronoi uniform, adaptive idw)", estimator: vor-uniform-aidw,
     family: equivalence, functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-vor-uniform-aidw, title: "V1 strength visible (Voronoi uniform, adaptive idw)", estimator: vor-uniform-aidw,
     family: one-sided, functional: coherence_ratio, map: point, min_ratio: 0.5}
  # V4 — Mondrian blocks averaged away. Axis-locking L = axis/diagonal spectral log ratio of the map
  # minus that of the same estimator on the data rotated 45° about the domain centre (same physical
  # points, same smoothing): ≈ 0 for rotation-invariant partitions, > 0 for axis-aligned artefacts.
  # v4a: median map L < 0.5 (Mondrian); v4b (power): single members L > 0 (Mondrian); v4c
  # (calibration): Voronoi median map L within ±0.5 of 0. δ = 0.5 chosen by the user.
  - {id: v4a-idw, title: "V4 blocks averaged away (idw)", estimator: idw, family: one-sided,
     functional: axis_lock, map: point, rotation_deg: 45.0, max_value: 0.5}
  - {id: v4b-idw, title: "V4 power check: single members are axis-locked (idw)", estimator: idw,
     family: one-sided, functional: axis_lock_members, map: member, rotation_deg: 45.0, members_checked: 5,
     min_value: 0.0}
  - {id: v4a-krig, title: "V4 blocks averaged away (krig)", estimator: krig, family: one-sided,
     functional: axis_lock, map: point, rotation_deg: 45.0, max_value: 0.5}
  - {id: v4b-krig, title: "V4 power check: single members are axis-locked (krig)", estimator: krig,
     family: one-sided, functional: axis_lock_members, map: member, rotation_deg: 45.0, members_checked: 5,
     min_value: 0.0}
  - {id: v4a-aidw, title: "V4 blocks averaged away (aidw)", estimator: aidw, family: one-sided,
     functional: axis_lock, map: point, rotation_deg: 45.0, max_value: 0.5}
  - {id: v4b-aidw, title: "V4 power check: single members are axis-locked (aidw)", estimator: aidw,
     family: one-sided, functional: axis_lock_members, map: member, rotation_deg: 45.0, members_checked: 5,
     min_value: 0.0}
  - {id: v4c-vor-uniform, title: "V4 calibration: no axis-locking without axis-aligned cells (vor-uniform-idw)",
     estimator: vor-uniform-idw, family: equivalence, functional: axis_lock, map: point, rotation_deg: 45.0, margin: 0.5}
  - {id: v4c-vor-uniform-krig, title: "V4 calibration: no axis-locking without axis-aligned cells (vor-uniform-krig)",
     estimator: vor-uniform-krig, family: equivalence, functional: axis_lock, map: point, rotation_deg: 45.0, margin: 0.5}
  - {id: v4c-vor-uniform-aidw, title: "V4 calibration: no axis-locking without axis-aligned cells (vor-uniform-aidw)",
     estimator: vor-uniform-aidw, family: equivalence, functional: axis_lock, map: point, rotation_deg: 45.0, margin: 0.5}
  # V5 — not washed out: std(median map) >= 0.9 · std(reference), the reference being the simple-
  # kriging map with the true covariance (the best linear predictor), computed from the same data.
  - {id: v5-idw, title: "V5 contrast against the best linear predictor (idw)", estimator: idw,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9,
     known_failure: "IDW with exponent 2 is smoother than the best linear predictor on this field (contrast ratio about 0.84)"}
  - {id: v5-aidw, title: "V5 contrast against the best linear predictor (aidw)", estimator: aidw,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  - {id: v5-krig, title: "V5 contrast against the best linear predictor (krig)", estimator: krig,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  - {id: v5-vor-uniform, title: "V5 contrast against the best linear predictor (vor-uniform-idw)", estimator: vor-uniform-idw,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9,
     known_failure: "IDW with exponent 2 is smoother than the best linear predictor on this field (contrast ratio about 0.89)"}
  - {id: v5-vor-data, title: "V5 contrast against the best linear predictor (vor-data-idw)", estimator: vor-data-idw,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9,
     known_failure: "IDW with exponent 2 is smoother than the best linear predictor on this field (contrast ratio about 0.89)"}
  - {id: v5-vor-uniform-krig, title: "V5 contrast against the best linear predictor (vor-uniform-krig)", estimator: vor-uniform-krig,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  - {id: v5-vor-uniform-aidw, title: "V5 contrast against the best linear predictor (vor-uniform-aidw)", estimator: vor-uniform-aidw,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  # Phase 2 decoders (v10): V1 and V5 with the pre-registered thresholds, V4 for the sharpened map.
  - {id: v1a-sharp, title: "V1 direction visible (sharpened adaptive idw)", estimator: sharp, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-sharp, title: "V1 strength visible (sharpened adaptive idw)", estimator: sharp, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v5-sharp, title: "V5 contrast against the best linear predictor (sharpened adaptive idw)", estimator: sharp,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  - {id: v1a-wdraw-aidw, title: "V1 direction visible (weighted draw, adaptive)", estimator: wdraw-aidw, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-wdraw-aidw, title: "V1 strength visible (weighted draw, adaptive)", estimator: wdraw-aidw, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v5-wdraw-aidw, title: "V5 contrast against the best linear predictor (weighted draw, adaptive)", estimator: wdraw-aidw,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  - {id: v1a-wdraw-sharp, title: "V1 direction visible (weighted draw, sharpened)", estimator: wdraw-sharp, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-wdraw-sharp, title: "V1 strength visible (weighted draw, sharpened)", estimator: wdraw-sharp, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v5-wdraw-sharp, title: "V5 contrast against the best linear predictor (weighted draw, sharpened)", estimator: wdraw-sharp,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  - {id: v1a-wdraw-idw, title: "V1 direction visible (weighted draw, idw)", estimator: wdraw-idw, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-wdraw-idw, title: "V1 strength visible (weighted draw, idw)", estimator: wdraw-idw, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v5-wdraw-idw, title: "V5 contrast against the best linear predictor (weighted draw, idw)", estimator: wdraw-idw,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  - {id: v1a-wdraw-krig, title: "V1 direction visible (weighted draw, kriging)", estimator: wdraw-krig, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-wdraw-krig, title: "V1 strength visible (weighted draw, kriging)", estimator: wdraw-krig, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5}
  - {id: v5-wdraw-krig, title: "V5 contrast against the best linear predictor (weighted draw, kriging)", estimator: wdraw-krig,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9}
  - {id: v1a-draw, title: "V1 direction visible (uniform draw)", estimator: draw, family: equivalence,
     functional: orientation, map: point, margin_deg: 10.0}
  - {id: v1b-draw, title: "V1 strength visible (uniform draw)", estimator: draw, family: one-sided,
     functional: coherence_ratio, map: point, min_ratio: 0.5,
     known_failure: "the uniform draw is built for coverage, not for a map: its median map is close to a cell median (coherence ratio about 0.41)"}
  - {id: v5-draw, title: "V5 contrast against the best linear predictor (uniform draw)", estimator: draw,
     family: one-sided, functional: contrast_ratio_reference, map: point, min_ratio: 0.9,
     known_failure: "the uniform draw is built for coverage, not for a map: its median map is washed out (contrast ratio about 0.55)"}
  - {id: v4a-sharp, title: "V4 blocks averaged away (sharpened)", estimator: sharp, family: one-sided,
     functional: axis_lock, map: point, rotation_deg: 45.0, max_value: 0.5,
     known_failure: "sharpening keeps more of each member's blocks (axis-locking about 0.46, against 0.39 for aidw), too close to the bound for 80 fields to separate"}
  - {id: v4b-sharp, title: "V4 power check: single members are axis-locked (sharpened)", estimator: sharp,
     family: one-sided, functional: axis_lock_members, map: member, rotation_deg: 45.0, members_checked: 5,
     min_value: 0.0}
  # Decoder ordering (the theory's comparison of four decoders): coverage of a 90 % interval read from
  # the ensemble alone grows from the averaged to the sharpened decoder, to the weighted draw and to the
  # uniform draw; the sharpened map is more accurate than the adaptive one. Paired over the K fields.
  - {id: order-cov-sharp, title: "coverage: sharpened above adaptive", estimator: sharp, against: aidw,
     family: paired-relation, functional: paired_relation, metric: coverage, better: greater}
  - {id: order-cov-wdraw, title: "coverage: weighted draw above sharpened", estimator: wdraw-aidw, against: sharp,
     family: paired-relation, functional: paired_relation, metric: coverage, better: greater}
  - {id: order-cov-draw, title: "coverage: uniform draw above weighted draw", estimator: draw, against: wdraw-aidw,
     family: paired-relation, functional: paired_relation, metric: coverage, better: greater}
  - {id: order-rmse-sharp, title: "error: sharpened map below adaptive", estimator: sharp, against: aidw,
     family: paired-relation, functional: paired_relation, metric: rmse, better: less}
provenance:
  calibration: "truth fields: θ = 26–29°, coherence 0.70–0.76; isotropic control coherence 0.05–0.09"
  v1: "idw only, K = 6; v1b p ≈ 4e-4 with 3 checks in the catalogue"
  v2: >
    2026-10-05: adaptive idw, kriging and two Voronoi estimators added with the same pre-registered
    thresholds, fixed before their first run; K raised to 12 (ci) / 20 (full) for power, since the
    catalogue grows from 3 to 11 checks under Holm. Fields 0–5 unchanged (same generator stream).
    First run (ci, K = 12, seed 12345): 11/11 pass, but the Voronoi orientation checks (s.e. ≈ 2°)
    passed close to their Holm levels (p = 2.9e-4 vs 5e-4, 6.9e-4 vs 1e-3), so K was raised to 20
    in ci too — more power, thresholds unchanged.
  v3: >
    2026-10-06: kriging and adaptive IDW on the uniform Voronoi profile, reached through
    libspatialize.run after the encoder/decoder refactor; same pre-registered thresholds, fixed before
    their first run; data unchanged.
  v4: >
    2026-10-06: visual criterion V5 (contrast against simple kriging with the true covariance;
    threshold 0.9 chosen by the user before any run of this criterion; diagnostics had already shown
    the public Voronoi IDW maps to be smoother than the others). First run: kriging and adaptive IDW
    pass on both partitions; IDW fails (0.84 Mondrian, 0.65 public Voronoi) — recorded as known
    failures, threshold unchanged.
    V4: the specification's axis-artefact index (gradient energy near the axes, bound 0.05) failed its
    power check (8 vs 100 members) and diagnostics showed it measures smoothing (Voronoi controls gave
    the same values). Redesigned as axis-locking against a 45°-rotated run (axis_lock); diagnostics on
    8 fields before fixing the threshold: single Mondrian members +1.8 to +2.8, Mondrian medians at
    T=100 +0.27 to +0.39, Voronoi ≈ 0 (±0.1). δ = 0.5 chosen by the user with those values known.
    First run (K = 20): power checks and Voronoi kriging/adaptive IDW calibrations pass; v4a-aidw and
    v4c on the public Voronoi IDW lack power (means 0.34 and -0.09, p ≈ 1-2e-3 against Holm levels
    ≈ 2e-4). K raised to 40 (ci and full, user decision); fields 0-19 unchanged; δ unchanged.
  v6: >
    2026-10-06: the IDW kernel was corrected (1/d^p everywhere; the public Voronoi IDW used 1/(1+d^p),
    close to a cell mean). Voronoi IDW maps are no longer smoothed: V5 contrast 0.67 -> 0.89, still
    below 0.9 like Mondrian IDW (0.85), so the known failures stay with an updated reason; V1
    coherence ratio 0.82 -> 0.64 (the smoothing had inflated it). Thresholds unchanged.
  pending: "add each new decoder (draw, wdraw_idw, wdraw_adaptiveidw, wdraw_kriging) as it lands"
  v7: "2026-10-06: encoder profiles renamed (mondrian, mondrian-theory, voronoi, voronoi-data); results unchanged"
  v8: >
    2026-10-06: K raised from 40 to 80 fields (ci and full, user decision); fields 0-39 unchanged,
    thresholds and δ unchanged. Reason: v4a-aidw lacked power, failing 4 of 14 runs at K = 40 (seeds
    101-111, 746237441, 20261006; 31 passed) while adaptive IDW's mean axis lock stayed well below
    the bound (0.339-0.410, average 0.368, against 0.5). The spread of one field's axis lock is about
    0.19, so at K = 40 the standard error is 0.030 and a pass at the Holm level (≈ 2.5e-4, t* ≈ 3.8)
    needs a mean below 0.386, which the seed-to-seed spread of the mean (s.d. 0.025) crosses about
    one run in four. At K = 80 the standard error is 0.021 and the mean must stay below 0.423, which
    it crosses about once in a thousand runs. K = 60 would still fail about one run in 50.
  v9: "2026-10-07: parameter parallelize removed from the adaptive IDW estimators (Spatialize runs in parallel through its session settings); results unchanged"
  v10: >
    2026-10-07: the decoders of phase 2 on the Mondrian partition (sharpened adaptive IDW, the weighted
    draws with adaptive, sharpened, IDW and kriging weights, the uniform draw), with V1 and V5 at the
    pre-registered thresholds and V4 for the sharpened map, and four paired checks of the theory's
    decoder ordering (coverage and map error); all fixed before their first run. The first run
    (seed 12345) failed three of them, recorded as known failures with the thresholds unchanged:
    the uniform draw's map on V1b and V5, and V4a on the sharpened map.
