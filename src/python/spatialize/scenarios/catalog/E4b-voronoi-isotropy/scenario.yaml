id: E4b-voronoi-isotropy
version: 1
tier: T1
evaluator: partition_law
book:
  topic: "co-occurrence function of the Poisson–Voronoi partition"
  draft_2026_10: "ch 5, co-occurrence of the partitions"   # the book is a draft
purpose: >
  The planar part of E4. A Poisson–Voronoi partition is isotropic, so two locations at a given
  distance share a cell with the same probability along an axis and along the diagonal. The
  Mondrian process measures distance in ℓ1, so along the diagonal it separates them more often,
  which serves as a negative control.
domain: {box: [[0.0, 1.0], [0.0, 1.0]]}
data:
  n: 400                                 # filler data: 60 nuclei on average, far below n
  centre: [0.5, 0.5]
  distances: [0.05, 0.1, 0.15]
  generator_seed: 20261009
estimators:
  - {id: v-plane, encoder: voronoi, rate: 60.0, decoder: cellmean, params: {}, empty_cells: nan}
  - {id: m-plane, encoder: mondrian, rate: 8.0, decoder: cellmean, params: {}, empty_cells: nan}
checks:
  - id: isotropy
    title: "the co-occurrence along an axis equals that along the diagonal"
    kind: isotropy
    family: identity
    estimators: [v-plane]
    n_members: {ci: 20000, full: 80000}
  - id: control-isotropy
    title: "negative control: the Mondrian process separates diagonal pairs more often"
    kind: isotropy
    family: identity
    estimators: [m-plane]
    n_members: {ci: 20000, full: 80000}
    expect: {default: reject}
provenance:
  v1: "2026-10-09: first version; sizes fixed before the first run."
